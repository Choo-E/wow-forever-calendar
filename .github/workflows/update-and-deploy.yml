name: 데이터 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *' # 30분마다 (정각을 피해서 접속 몰림 방지)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write # 갱신한 데이터를 저장소에 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 소식 데이터 수집
        run: node scripts/build-data.js

      # 웹훅 주소는 저장소 Settings → Secrets 에 넣어 둔다. 없으면 이 단계는 알아서 건너뛴다.
      # 디스코드 쪽이 실패해도 사이트 갱신·배포는 계속되도록 continue-on-error 를 둔다.
      - name: 디스코드 일정판 갱신
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/post-discord.js

      - name: 바뀐 데이터가 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feed.json
          if [ -f data/discord-state.json ]; then git add data/discord-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: 소식 데이터 갱신"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
